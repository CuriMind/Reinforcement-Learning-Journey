<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-cn" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
        crossorigin="anonymous">
</head>
<body>
  <button class="sb-toggle" onclick="document.body.classList.toggle('sb-open')">☰ 目录</button>

  <aside class="sb">
    <a class="brand" href="{{ "" | relURL }}">{{ site.Title }}</a>
    {{ partial "sidebar.html" . }}
    {{ with site.Params.repoURL }}
    <p class="sb-foot"><a href="{{ . }}" target="_blank" rel="noopener">GitHub 仓库 ↗</a></p>
    {{ end }}
  </aside>

  <main class="main">
    <article class="doc">
      {{ block "main" . }}{{ end }}
    </article>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
          crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
          integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
          crossorigin="anonymous"
          onload="renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$',  right: '$',  display: false},
              {left: '\\[', right: '\\]', display: true},
              {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false,
            ignoredTags: ['script','noscript','style','textarea','pre','code']
          });"></script>
</body>
</html>
