name: 构建并部署 Hugo 站点到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:            # 允许在 Actions 页面手动触发

# 只给部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，不取消进行中的（避免半成品上线）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node（用于生成 site/content）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 从源 md 生成站点内容
        run: node scripts/prepare-content.mjs

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: false

      - name: 读取 Pages 配置（拿到 baseURL）
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建站点
        run: |
          hugo --source site \
               --destination public \
               --minify \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
