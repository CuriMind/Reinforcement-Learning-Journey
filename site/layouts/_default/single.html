{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>

  {{ with .Content }}{{ . }}{{ end }}

  <nav class="pager">
    {{ with .PrevInSection }}<a class="prev" href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ else }}<span></span>{{ end }}
    {{ with .NextInSection }}<a class="next" href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}
  </nav>
{{ end }}
